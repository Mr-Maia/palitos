<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aponta">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7FAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#152A32" media="(prefers-color-scheme: dark)">
<title>Aponta no Mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #E4ECEE;
  --surface: #F7FAFA;
  --land: #FFFFFF;
  --land-off: #CFDBDE;
  --edge: #7C949B;
  --edge-soft: #A9BCC1;
  --ink: #12303A;
  --muted: #557079;
  --accent: #1B6A86;
  --accent-ink: #FFFFFF;
  --ok: #2F9E5C;
  --warn: #E6B325;
  --bad: #D34B40;
  --shadow: 0 1px 2px rgba(18,48,58,.08), 0 6px 20px rgba(18,48,58,.08);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1B20; --surface: #152A32; --land: #28434D; --land-off: #172D35;
    --edge: #587983; --edge-soft: #2D4852;
    --ink: #E3EEF1; --muted: #8FA9B1; --accent: #5FB3D1; --accent-ink: #0D1B20;
    --ok: #3DBA6F; --warn: #F0C23B; --bad: #E4625A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1B20; --surface: #152A32; --land: #28434D; --land-off: #172D35;
  --edge: #587983; --edge-soft: #2D4852;
  --ink: #E3EEF1; --muted: #8FA9B1; --accent: #5FB3D1; --accent-ink: #0D1B20;
  --ok: #3DBA6F; --warn: #F0C23B; --bad: #E4625A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
@supports (height: 100dvh) { html, body { height: 100dvh; } }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.screen { height: 100%; display: flex; flex-direction: column; }

/* ---------- Menu ---------- */
#menu { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 28px) calc(env(safe-area-inset-bottom, 0px) + 28px); }
.menu-inner { width: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.menu-left, .menu-right { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.brand h1 .br { display: block; }
.brand h1 {
  font: 800 clamp(34px, 10vw, 46px)/0.95 var(--display);
  letter-spacing: -0.02em; margin: 0; text-wrap: balance;
}
.brand p { margin: 8px 0 0; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.sound-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 10px;
  border-radius: 999px; border: 1px solid var(--edge-soft); background: var(--surface); font-weight: 700; font-size: 14px;
}
.pill svg, .icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill[aria-pressed="true"] svg { stroke: var(--accent-ink); }
[aria-pressed] .slash { display: none; }
[aria-pressed="false"] .slash { display: inline; }
[aria-pressed="false"] .wave { display: none; }
[aria-pressed="false"] svg { opacity: .7; }

.card {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  width: 100%; text-align: left; border: 1px solid var(--edge-soft);
  background: var(--surface); border-radius: 16px; padding: 14px 16px;
  box-shadow: var(--shadow); transition: transform .12s ease;
}
.card:active { transform: scale(.98); }
.card .t { font: 700 20px/1.1 var(--display); margin: 0; }
.card .s { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.card svg { display: block; }
.card path { fill: var(--accent); stroke: none; }
.card .ctx { fill: var(--land-off); }

.card.pt svg { width: 96px; height: 120px; }
.card.pt { grid-template-columns: 1fr 96px; padding: 18px 18px; border-color: var(--accent); }
.card.pt .t { font-size: 30px; }
.card.pt .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 4px; }

.section-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 6px 2px -10px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card > div { min-width: 0; }
.grid .card { grid-template-columns: 1fr; grid-template-rows: 64px auto; padding: 12px; }
.grid .card svg { width: 100%; height: 64px; }

/* ---------- Game ---------- */
#game {
  position: relative; display: grid;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "map" "ask";
}
.topbar { grid-area: top; }
.map-wrap { grid-area: map; }
.ask { grid-area: ask; }
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding-inline: max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 8px) 8px;
  background: var(--surface); border-bottom: 1px solid var(--edge-soft); z-index: 2;
}
.icon-btn:active, .btn:active, .pill:active { transform: scale(.94); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--edge-soft);
  background: var(--bg); display: grid; place-items: center; flex: none;
}
.topbar .title { flex: 1; min-width: 0; }
.topbar .title b { font: 700 17px/1.1 var(--display); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 5px; background: var(--land-off); border-radius: 3px; margin-top: 6px; overflow: hidden; display: flex; }
.progress i { display: block; height: 100%; transition: width .3s ease; }
.tally { display: flex; gap: 8px; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; }
.tally em { font-style: normal; }
.tally span { display: inline-flex; align-items: center; gap: 4px; }
.tally i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.map-wrap { position: relative; overflow: hidden; touch-action: none; }
#map { width: 100%; height: 100%; display: block; }
#map .ctx { fill: var(--land-off); stroke: var(--edge-soft); stroke-width: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
#map .rg { fill: var(--land); stroke: var(--edge); stroke-width: .8; vector-effect: non-scaling-stroke; transition: fill .25s ease; }
#map .dot { fill: var(--land); stroke: var(--edge); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#map .hit { fill: transparent; stroke: none; }
#map .done-ok { fill: var(--ok); }
#map .done-warn { fill: var(--warn); }
#map .done-bad { fill: var(--bad); }
#map .wrong { fill: var(--bad); fill-opacity: .45; transition: none; }
#map .hint { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { fill: var(--accent); } }

.float-btns { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; display: flex; flex-direction: column; gap: 8px; }
.float-btns .icon-btn { background: var(--surface); box-shadow: var(--shadow); }
.float-btns .sep { height: 4px; }
.float-btns [aria-pressed="false"] { background: var(--bg); box-shadow: none; }

.toast {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 700; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .2s ease; max-width: calc(100% - 120px); overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: .92; }

.ask {
  background: var(--surface); border-top: 1px solid var(--edge-soft);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(env(safe-area-inset-bottom, 0px) + 14px);
  text-align: center; z-index: 2;
}
.ask .lbl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ask .target { font: 800 clamp(26px, 8vw, 34px)/1.1 var(--display); margin: 4px 0 8px; text-wrap: balance; letter-spacing: -0.01em; }
.ask .target.pop { animation: pop .3s ease; }
@keyframes pop { from { transform: scale(.9); opacity: .3; } }
.tries { display: flex; justify-content: center; gap: 6px; height: 10px; }
.tries i { width: 22px; height: 6px; border-radius: 3px; background: var(--land-off); }
.tries i.on { background: var(--bad); }
.tries-note { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 16px; }

/* ---------- End ---------- */
.end {
  position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  display: grid; place-items: end center; z-index: 5; padding: 16px; overflow-y: auto;
}
.end .sheet {
  width: 100%; max-width: 460px; background: var(--surface); border-radius: 20px;
  padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); box-shadow: var(--shadow);
  border: 1px solid var(--edge-soft);
}
.end h2 { font: 800 30px/1 var(--display); margin: 0 0 4px; }
.end .sub { color: var(--muted); margin: 0 0 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat { border-radius: 12px; padding: 10px; background: var(--bg); }
.stat b { font: 800 28px/1 var(--display); display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.ok b { color: var(--ok); } .stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }
.missed { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.missed strong { color: var(--ink); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border-radius: 12px; padding: 13px; font-weight: 700; border: 1px solid var(--edge-soft); background: var(--bg); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- Responsive ---------- */
/* Telemóveis pequenos */
@media (max-width: 360px) {
  .topbar { gap: 8px; }
  .topbar .title b { font-size: 15px; }
  .tally { gap: 5px; font-size: 12px; }
  .grid .card { padding: 10px; }
  .card .t { font-size: 17px; }
  .card.pt .t { font-size: 26px; }
  .end .stat b { font-size: 24px; }
}

/* Tablet na vertical e ecrãs médios */
@media (min-width: 620px) {
  .menu-inner { max-width: 760px; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .grid .card { grid-template-rows: 90px auto; padding: 14px; }
  .grid .card svg { height: 90px; }
  .card.pt { grid-template-columns: 1fr 120px; padding: 22px; }
  .card.pt svg { width: 120px; height: 150px; }
  .card.pt .t { font-size: 36px; }
  .topbar .title b { font-size: 20px; }
  .tally { font-size: 15px; gap: 12px; }
  .ask .target { font-size: clamp(34px, 5vw, 46px); }
  .tries i { width: 30px; height: 7px; }
  .tries-note { font-size: 14px; }
  .end { place-items: center; }
}

/* Computador: menu em duas colunas */
@media (min-width: 1000px) {
  #menu { display: grid; place-items: center; }
  .menu-inner { max-width: 1120px; flex-direction: row; gap: 48px; align-items: flex-start; }
  .menu-left { flex: 0 0 360px; }
  .menu-right { flex: 1; }
  .brand h1 { font-size: 64px; }
  .card.pt { grid-template-columns: 1fr; grid-template-rows: 220px auto; }
  .card.pt svg { width: 100%; height: 220px; order: -1; }
  .grid .card { grid-template-rows: 120px auto; }
  .grid .card svg { height: 120px; }
  .card:hover { border-color: var(--accent); }
}

/* Jogo com painel lateral: telemóvel deitado, tablet deitado e computador */
@media (orientation: landscape) and (max-height: 600px), (min-width: 1000px) {
  #game {
    grid-template-columns: minmax(0, 1fr) clamp(200px, 30vw, 360px);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top" "map ask";
  }
  .ask {
    border-top: none; border-left: 1px solid var(--edge-soft);
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    padding-inline: 16px max(16px, env(safe-area-inset-right, 0px));
  }
  .ask .target { font-size: clamp(24px, 3.4vw, 44px); overflow-wrap: anywhere; }
  .end { place-items: center; }
}

/* Telemóvel deitado: tudo mais compacto na altura */
@media (orientation: landscape) and (max-height: 600px) {
  #menu {
    padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .menu-inner { max-width: 1000px; flex-direction: row; gap: 20px; align-items: flex-start; }
  .menu-left { flex: 0 0 min(300px, 38%); gap: 14px; }
  .menu-right { flex: 1; gap: 14px; }
  .brand h1 { font-size: 32px; }
  .brand h1 .br { display: inline; }
  .brand p { font-size: 14px; }
  .legend { margin-top: 8px; }
  .sound-row { margin-top: 10px; }
  .section-label { margin: 0 2px -6px; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid .card { grid-template-rows: 54px auto; padding: 10px; }
  .grid .card svg { height: 54px; }
  .grid .card .t { font-size: 16px; }
  .card.pt { grid-template-columns: 1fr 70px; grid-template-rows: auto; padding: 12px 14px; }
  .card.pt svg { width: 70px; height: 88px; order: 0; }
  .card.pt .t { font-size: 24px; }
  .topbar { padding-block: calc(env(safe-area-inset-top, 0px) + 4px) 4px; }
  .topbar .icon-btn { width: 38px; height: 38px; }
  .float-btns { top: 8px; gap: 6px; }
  .float-btns .icon-btn { width: 38px; height: 38px; }
  .float-btns .sep { height: 0; }
  /* O nome a encontrar vai para a barra de cima: o mapa fica com o ecrã todo. */
  #game {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top" "map";
  }
  .topbar { position: relative; }
  .topbar .title b { visibility: hidden; }
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; margin: 0; border-radius: 0; }
  .ask {
    grid-area: top; align-self: center; justify-self: center; z-index: 3;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
    max-width: calc(100% - 2 * (max(12px, env(safe-area-inset-right, 0px)) + 130px));
    background: none; border: none; padding: 0; pointer-events: none;
  }
  .ask .lbl { flex: none; font-size: 11px; }
  .ask .target {
    font-size: clamp(17px, 3.2vw, 24px); margin: 0; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal;
  }
  .tries { flex: none; height: auto; gap: 4px; }
  .tries i { width: 14px; height: 5px; }
  .tries-note { display: none; }
  .end { padding: 10px; }
  .end .sheet { padding: 16px; max-width: 520px; }
  .end h2 { font-size: 24px; }
  .end .sub, .stats, .missed { margin-bottom: 10px; }
}

.loading { display: grid; place-items: center; height: 100%; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="loading" class="loading">A carregar mapas…</div>

<section id="menu" class="screen" hidden>
  <div class="menu-inner">
   <div class="menu-left">
    <header class="brand">
      <h1>Aponta no <span class="br"></span>Mapa</h1>
      <p>Aparece um nome em baixo. Toca no sítio certo do mapa.</p>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>À primeira</span>
        <span><i style="background:var(--warn)"></i>2–3 tentativas</span>
        <span><i style="background:var(--bad)"></i>Mais de 3</span>
      </div>
      <div class="sound-row">
        <button class="pill" id="m-music" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/></svg>
          Música
        </button>
        <button class="pill" id="m-sfx" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/><path class="slash" d="M3 3l18 18"/></svg>
          Sons
        </button>
      </div>
    </header>

    <button class="card pt" id="btn-portugal" data-mode="portugal">
      <div>
        <div class="eyebrow">18 distritos</div>
        <div class="t">Portugal</div>
        <div class="s" data-best="portugal"></div>
      </div>
      <svg data-thumb="portugal" aria-hidden="true"></svg>
    </button>
   </div>
   <div class="menu-right">
    <div class="section-label">Continentes</div>
    <div class="grid" id="continents"></div>
   </div>
  </div>
</section>

<section id="game" class="screen" hidden>
  <div class="topbar">
    <button class="icon-btn" id="back" aria-label="Voltar ao menu">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="title">
      <b id="g-title">Portugal</b>
      <div class="progress" id="g-progress"></div>
    </div>
    <div class="tally">
      <span><i style="background:var(--ok)"></i><em id="c-ok">0</em></span>
      <span><i style="background:var(--warn)"></i><em id="c-warn">0</em></span>
      <span><i style="background:var(--bad)"></i><em id="c-bad">0</em></span>
    </div>
  </div>

  <div class="map-wrap" id="map-wrap">
    <svg id="map" role="application" aria-label="Mapa"></svg>
    <div class="float-btns">
      <button class="icon-btn" id="zoom-in" aria-label="Aproximar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="zoom-out" aria-label="Afastar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="icon-btn" id="zoom-reset" aria-label="Ver mapa inteiro"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <span class="sep"></span>
      <button class="icon-btn" id="g-music" aria-label="Música" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path class="slash" d="M3 3l18 18"/></svg></button>
      <button class="icon-btn" id="g-sfx" aria-label="Sons" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/><path class="slash" d="M3 3l18 18"/></svg></button>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="ask" aria-live="polite">
    <div class="lbl" id="ask-lbl">Toca em</div>
    <div class="target" id="target">—</div>
    <div class="tries" id="tries"></div>
    <div class="tries-note" id="tries-note"></div>
  </div>

  <div class="end" id="end" hidden>
    <div class="sheet">
      <h2 id="end-title">Muito bem!</h2>
      <p class="sub" id="end-sub"></p>
      <div class="stats">
        <div class="stat ok"><b id="e-ok">0</b><span>à primeira</span></div>
        <div class="stat warn"><b id="e-warn">0</b><span>2–3 tentativas</span></div>
        <div class="stat bad"><b id="e-bad">0</b><span>mais de 3</span></div>
      </div>
      <p class="missed" id="e-missed" hidden></p>
      <div class="actions">
        <button class="btn" id="e-menu">Menu</button>
        <button class="btn primary" id="e-again">Jogar outra vez</button>
      </div>
    </div>
  </div>
</section>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="audio.js"></script>
<script>
(() => {
  // Cada modo: nome e caixa lon/lat a enquadrar (projeção de Mercator, como nos mapas habituais).
  const MODES = {
    portugal: { name: 'Portugal', unit: 'distritos' },
    europa:  { name: 'Europa',            box: [[-25, 34], [45, 71]] },
    africa:  { name: 'África',            box: [[-20, -36], [52, 38]] },
    asia:    { name: 'Ásia',              box: [[26, -11], [148, 55]] },
    anorte:  { name: 'América do Norte',  box: [[-168, 7], [-52, 70]] },
    asul:    { name: 'América do Sul',    box: [[-82, -56], [-34, 13]] },
    oceania: { name: 'Oceânia',           box: [[112, -48], [-172, 12]] },
  };
  const CONTINENTS = ['europa', 'africa', 'asia', 'anorte', 'asul', 'oceania'];
  const HINT_AFTER = 5; // erros até o mapa piscar o sítio certo

  let world = [], portugal = [];

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // d3 espera anéis exteriores no sentido horário; corrige se a feature "cobrir o globo".
  function rewind(f) {
    if (d3.geoArea(f) > 2 * Math.PI) {
      const g = f.geometry;
      const rev = (poly) => poly.map((r) => r.slice().reverse());
      if (g.type === 'Polygon') g.coordinates = rev(g.coordinates);
      else if (g.type === 'MultiPolygon') g.coordinates = g.coordinates.map(rev);
    }
    return f;
  }

  function boxPoints([[x0, y0], [x1, y1]]) {
    if (x1 < x0) x1 += 360;
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const x = x0 + (x1 - x0) * i / 8;
      pts.push([x, y0], [x, y1]);
    }
    for (let i = 0; i <= 4; i++) {
      const y = y0 + (y1 - y0) * i / 4;
      pts.push([x0, y], [x1, y]);
    }
    return { type: 'MultiPoint', coordinates: pts.map(([x, y]) => [x > 180 ? x - 360 : x, y]) };
  }

  function projectionFor(mode, w, h, pad) {
    const m = MODES[mode];
    if (mode === 'portugal') {
      return d3.geoMercator().fitExtent([[pad, pad], [w - pad, h - pad]], { type: 'FeatureCollection', features: portugal });
    }
    // Roda só na longitude (o norte fica sempre para cima) para centrar o continente,
    // o que também resolve a Oceânia, que atravessa a linha de mudança de data.
    let [[x0], [x1]] = m.box;
    if (x1 < x0) x1 += 360;
    return d3.geoMercator().rotate([-(x0 + x1) / 2, 0])
      .fitExtent([[pad, pad], [w - pad, h - pad]], boxPoints(m.box));
  }

  function regionsFor(mode) {
    return mode === 'portugal' ? portugal : world.filter((f) => f.properties.c === mode);
  }

  // ---------- menu ----------
  function drawThumb(svg, mode) {
    const w = svg.clientWidth || +svg.getAttribute('width'), h = svg.clientHeight || +svg.getAttribute('height');
    const proj = projectionFor(mode, w, h, 2);
    const path = d3.geoPath(proj);
    const sel = d3.select(svg).attr('viewBox', `0 0 ${w} ${h}`);
    sel.selectAll('*').remove();
    if (mode !== 'portugal') {
      sel.append('g').selectAll('path').data(world.filter((f) => f.properties.c !== mode))
        .join('path').attr('class', 'ctx').attr('d', path);
    }
    sel.append('g').selectAll('path').data(regionsFor(mode)).join('path').attr('d', path);
  }

  function bestText(mode) {
    const b = store.get('best:' + mode);
    return b ? `Recorde: ${b.ok}/${b.total} à primeira` : '';
  }

  function buildMenu() {
    const grid = $('continents');
    grid.innerHTML = '';
    for (const mode of CONTINENTS) {
      const n = regionsFor(mode).length;
      const b = document.createElement('button');
      b.className = 'card';
      b.dataset.mode = mode;
      b.innerHTML = `<svg data-thumb="${mode}" aria-hidden="true"></svg>
        <div><div class="t">${MODES[mode].name}</div><div class="s">${n} países</div><div class="s" data-best="${mode}"></div></div>`;
      grid.appendChild(b);
    }
    document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { Som.play.tap(); startGame(b.dataset.mode); }));
  }

  function showMenu() {
    $('game').hidden = true;
    $('menu').hidden = false;
    document.querySelectorAll('[data-thumb]').forEach((svg) => drawThumb(svg, svg.dataset.thumb));
    document.querySelectorAll('[data-best]').forEach((el) => { el.textContent = bestText(el.dataset.best); });
  }

  // ---------- jogo ----------
  let G = null;
  const svg = d3.select('#map');
  const zoom = d3.zoom().on('zoom', (e) => {
    G && G.layer.attr('transform', e.transform);
    G && G.layer.selectAll('.dot').attr('r', 6 / e.transform.k);
    G && G.layer.selectAll('.hit').attr('r', 14 / e.transform.k);
  });
  svg.call(zoom).on('dblclick.zoom', null);

  function startGame(mode) {
    // Entrada no histórico: o botão "voltar" do telemóvel regressa ao menu.
    if (!history.state || !history.state.game) history.pushState({ game: mode }, '', '#' + mode);
    $('menu').hidden = true;
    $('game').hidden = false;
    $('end').hidden = true;
    const regions = regionsFor(mode);
    G = {
      mode,
      regions,
      queue: shuffle(regions.map((f) => f.properties.n)),
      idx: 0,
      misses: 0,
      result: new Map(), // nome -> 'ok' | 'warn' | 'bad'
      started: Date.now(),
      layer: null,
    };
    $('g-title').textContent = MODES[mode].name;
    renderMap();
    showTarget();
    updateTally();
  }

  function renderMap() {
    const wrap = $('map-wrap');
    const w = wrap.clientWidth, h = wrap.clientHeight;
    const proj = projectionFor(G.mode, w, h, G.mode === 'portugal' ? 20 : 8);
    const path = d3.geoPath(proj);
    svg.attr('viewBox', `0 0 ${w} ${h}`).selectAll('*').remove();
    const layer = svg.append('g');
    G.layer = layer;

    if (G.mode !== 'portugal') {
      layer.append('g').selectAll('path').data(world.filter((f) => f.properties.c !== G.mode))
        .join('path').attr('class', 'ctx').attr('d', path);
    }

    const byName = new Map();
    const shapes = layer.append('g').selectAll('path').data(G.regions).join('path')
      .attr('class', 'rg').attr('d', path)
      .on('click', (e, f) => onPick(f.properties.n));
    shapes.each(function (f) { byName.set(f.properties.n, [this]); });

    // Países demasiado pequenos para tocar ganham um ponto (e uma área de toque maior).
    const tiny = G.regions.filter((f) => path.area(f) < 40);
    const dots = layer.append('g');
    for (const f of tiny) {
      const c = dotPosition(f, path, proj);
      if (!c) continue;
      const dot = dots.append('circle').attr('class', 'rg dot').attr('cx', c[0]).attr('cy', c[1]).attr('r', 6).datum(f);
      dots.append('circle').attr('class', 'hit').attr('cx', c[0]).attr('cy', c[1]).attr('r', 14)
        .on('click', () => onPick(f.properties.n));
      dot.on('click', () => onPick(f.properties.n));
      byName.get(f.properties.n).push(dot.node());
    }
    G.els = byName;

    // Reaplica cores de um jogo em curso (ex.: rodar o ecrã).
    for (const [n, cls] of G.result) G.els.get(n).forEach((el) => el.classList.add('done-' + cls));
    if (G.misses >= HINT_AFTER && current()) G.els.get(current()).forEach((el) => el.classList.add('hint'));
    G.size = [w, h];

    zoom.scaleExtent([1, G.mode === 'portugal' ? 6 : 14]).translateExtent([[-w * 0.25, -h * 0.25], [w * 1.25, h * 1.25]]);
    svg.call(zoom.transform, d3.zoomIdentity);
  }

  // Onde pôr a bola de um país pequeno: no centro, se o centro cair dentro do país.
  // Em formas côncavas (ex.: Israel) o centro cai fora; aí usa o ponto mais interior do país.
  // Arquipélagos (ex.: Bahamas) ficam no centro, entre as ilhas.
  function dotPosition(f, path, proj) {
    const c = path.centroid(f);
    if (!isFinite(c[0])) return null;
    if (d3.geoContains(f, proj.invert(c))) return c;
    if (f.geometry.type === 'MultiPolygon' && f.geometry.coordinates.length > 1) return c;
    const [[x0, y0], [x1, y1]] = path.bounds(f);
    const n = 16, sx = (x1 - x0) / n, sy = (y1 - y0) / n;
    const ins = [], outs = [];
    for (let i = -1; i <= n + 1; i++) for (let j = -1; j <= n + 1; j++) {
      const p = [x0 + i * sx, y0 + j * sy];
      (i >= 0 && i <= n && j >= 0 && j <= n && d3.geoContains(f, proj.invert(p)) ? ins : outs).push(p);
    }
    let best = null, bestD = -1;
    for (const p of ins) {
      let d = Infinity;
      for (const q of outs) d = Math.min(d, (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2);
      if (d > bestD) { bestD = d; best = p; }
    }
    return best || c;
  }

  function current() { return G.queue[G.idx]; }

  function showTarget() {
    const t = $('target');
    t.textContent = current();
    t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
    renderTries();
  }

  function renderTries() {
    const box = $('tries');
    box.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const b = document.createElement('i');
      if (i < G.misses) b.className = 'on';
      box.appendChild(b);
    }
    const note = G.misses === 0 ? '' : G.misses <= 2 ? `${G.misses} erro${G.misses > 1 ? 's' : ''} — ainda fica amarelo`
      : G.misses < HINT_AFTER ? 'Já vai ficar vermelho' : 'Olha para o que está a piscar';
    $('tries-note').textContent = note;
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
  }

  function onPick(name) {
    if (!G || G.idx >= G.queue.length) return;
    if (G.result.has(name)) { toast(name); return; }
    const target = current();
    const els = G.els.get(name);

    if (name !== target) {
      G.misses++;
      toast(`Isso é ${name}`);
      els.forEach((el) => { el.classList.add('wrong'); setTimeout(() => el.classList.remove('wrong'), 450); });
      Som.play.wrong();
      if (navigator.vibrate) navigator.vibrate(40);
      if (G.misses >= HINT_AFTER) G.els.get(target).forEach((el) => el.classList.add('hint'));
      renderTries();
      return;
    }

    const attempts = G.misses + 1;
    const cls = attempts === 1 ? 'ok' : attempts <= 3 ? 'warn' : 'bad';
    G.result.set(name, cls);
    els.forEach((el) => { el.classList.remove('hint', 'wrong'); el.classList.add('done-' + cls); });
    G.els.get(target).forEach((el) => el.classList.remove('hint'));
    Som.play[cls]();
    G.idx++;
    G.misses = 0;
    updateTally();
    if (G.idx >= G.queue.length) finish();
    else showTarget();
  }

  function counts() {
    const c = { ok: 0, warn: 0, bad: 0 };
    for (const v of G.result.values()) c[v]++;
    return c;
  }

  function updateTally() {
    const c = counts(), total = G.queue.length;
    $('c-ok').textContent = c.ok; $('c-warn').textContent = c.warn; $('c-bad').textContent = c.bad;
    $('g-progress').innerHTML = ['ok', 'warn', 'bad'].map((k) => `<i style="width:${c[k] / total * 100}%;background:var(--${k})"></i>`).join('');
  }

  function finish() {
    const c = counts(), total = G.queue.length;
    const secs = Math.round((Date.now() - G.started) / 1000);
    const time = secs >= 60 ? `${Math.floor(secs / 60)} min ${secs % 60} s` : `${secs} s`;
    const pct = c.ok / total;
    $('end-title').textContent = pct === 1 ? 'Perfeito!' : pct >= 0.75 ? 'Muito bem!' : pct >= 0.4 ? 'Bom trabalho' : 'Continua a treinar';
    $('end-sub').textContent = `${MODES[G.mode].name} · ${total} ${G.mode === 'portugal' ? 'distritos' : 'países'} em ${time}`;
    $('e-ok').textContent = c.ok; $('e-warn').textContent = c.warn; $('e-bad').textContent = c.bad;
    const bad = [...G.result].filter(([, v]) => v === 'bad').map(([n]) => n);
    const m = $('e-missed');
    m.hidden = bad.length === 0;
    if (bad.length) m.innerHTML = `A rever: <strong>${bad.join(', ')}</strong>`;
    const prev = store.get('best:' + G.mode);
    if (!prev || c.ok > prev.ok) store.set('best:' + G.mode, { ok: c.ok, total });
    $('ask-lbl').textContent = 'Terminado';
    $('target').textContent = `${c.ok}/${total} à primeira`;
    $('tries').innerHTML = ''; $('tries-note').textContent = '';
    $('end').hidden = false;
    setTimeout(() => Som.play.finish(), 350);
  }

  // ---------- controlos ----------
  const goMenu = () => { if (history.state && history.state.game) history.back(); else showMenu(); };
  $('back').addEventListener('click', goMenu);
  $('e-menu').addEventListener('click', goMenu);
  window.addEventListener('popstate', () => {
    const h = location.hash.slice(1);
    if (history.state && history.state.game && MODES[h]) startGame(h);
    else { history.replaceState(null, '', location.pathname); showMenu(); }
  });
  $('e-again').addEventListener('click', () => { $('ask-lbl').textContent = 'Toca em'; startGame(G.mode); });
  $('zoom-in').addEventListener('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1.8));
  $('zoom-out').addEventListener('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.8));
  $('zoom-reset').addEventListener('click', () => svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity));

  // Música e sons: os botões do menu e do jogo mostram sempre o mesmo estado.
  const bindToggle = (ids, key, set) => ids.forEach((id) => $(id).addEventListener('click', () => set(!Som.prefs[key])));
  bindToggle(['m-music', 'g-music'], 'music', (on) => Som.setMusic(on));
  bindToggle(['m-sfx', 'g-sfx'], 'sfx', (on) => Som.setSfx(on));
  Som.onChange((p) => {
    ['m-music', 'g-music'].forEach((id) => $(id).setAttribute('aria-pressed', p.music));
    ['m-sfx', 'g-sfx'].forEach((id) => $(id).setAttribute('aria-pressed', p.sfx));
    $('g-music').setAttribute('aria-label', p.music ? 'Desligar música' : 'Ligar música');
    $('g-sfx').setAttribute('aria-label', p.sfx ? 'Desligar sons' : 'Ligar sons');
  });

  // Redesenha quando o ecrã muda (rodar o telemóvel, redimensionar a janela).
  // Pequenas mudanças de altura (barra do navegador a aparecer/esconder) não reiniciam o zoom.
  let resizeTimer;
  const onResize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!$('game').hidden && G) {
        const wrap = $('map-wrap'), [w0, h0] = G.size || [0, 0];
        if (Math.abs(wrap.clientWidth - w0) > 1 || Math.abs(wrap.clientHeight - h0) > 90) renderMap();
      } else if (!$('menu').hidden) document.querySelectorAll('[data-thumb]').forEach((s) => drawThumb(s, s.dataset.thumb));
    }, 120);
  };
  if (window.ResizeObserver) {
    new ResizeObserver(onResize).observe($('map-wrap'));
    new ResizeObserver(onResize).observe($('menu'));
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  // ---------- arranque ----------
  Promise.all([fetch('data/mundo.json').then((r) => r.json()), fetch('data/portugal.json').then((r) => r.json())])
    .then(([topo, pt]) => {
      world = topojson.feature(topo, topo.objects.countries).features;
      portugal = pt.features.map((f) => rewind({ type: 'Feature', properties: { n: f.properties.name }, geometry: f.geometry }));
      $('loading').hidden = true;
      buildMenu();
      const h = location.hash.slice(1);
      if (MODES[h]) {
        history.replaceState(null, '', location.pathname);
        showMenu();
        startGame(h);
      } else showMenu();
    })
    .catch(() => { $('loading').textContent = 'Não foi possível carregar os mapas. Verifica a ligação e recarrega a página.'; });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
